services:
  - type: web
    name: interactive-portfolio-cms
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ADMIN_PASSWORD
        value: studio2026
      - key: TIDB_HOST
        value: gateway01.ap-southeast-1.prod.aws.tidbcloud.com
      - key: TIDB_PORT
        value: "4000"
      - key: TIDB_USER
        value: 43eghUc9ZhsAxAo.root
      - key: TIDB_DATABASE
        value: sys
